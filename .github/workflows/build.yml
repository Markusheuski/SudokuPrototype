name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project SudokuPrototype.xcodeproj \
            -scheme SudokuPrototype \
            -sdk iphoneos \
            -archivePath build/SudokuPrototype.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/SudokuPrototype.xcarchive/Products/Applications/SudokuPrototype.app build/Payload/
          cd build
          zip -r SudokuPrototype-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SudokuPrototype-unsigned-ipa
          path: build/SudokuPrototype-unsigned.ipa
